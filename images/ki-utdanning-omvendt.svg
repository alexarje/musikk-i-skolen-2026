<rect width='1200' height='675' fill='#ffffff'/>
<text x='600' y='55' text-anchor='middle' font-size='32' fill='#1a202c' font-weight='bold' font-style='normal'>KI utenfor timen, mennesker i timen</text><rect x='60' y='110' width='500' height='470' rx='18' fill='#ebf8ff' stroke='#2b6cb0' stroke-width='2'/><text x='310' y='155' text-anchor='middle' font-size='26' fill='#2b6cb0' font-weight='bold' font-style='normal'>Før og etter timen</text><g transform='translate(120,230) scale(0.55)'><rect x='-18' y='-46' width='36' height='32' rx='6' fill='#2b6cb0'/><circle cx='-7' cy='-32' r='4' fill='#fff'/><circle cx='7' cy='-32' r='4' fill='#fff'/><rect x='-24' y='-8' width='48' height='38' rx='8' fill='#2b6cb0'/><line x1='0' y1='-46' x2='0' y2='-56' stroke='#2b6cb0' stroke-width='3'/><circle cx='0' cy='-58' r='4' fill='#2b6cb0'/></g><text x='160' y='238' text-anchor='start' font-size='22' fill='#1a202c' font-weight='normal' font-style='normal'>Lærebok med apper</text><g transform='translate(120,298) scale(0.55)'><rect x='-18' y='-46' width='36' height='32' rx='6' fill='#2b6cb0'/><circle cx='-7' cy='-32' r='4' fill='#fff'/><circle cx='7' cy='-32' r='4' fill='#fff'/><rect x='-24' y='-8' width='48' height='38' rx='8' fill='#2b6cb0'/><line x1='0' y1='-46' x2='0' y2='-56' stroke='#2b6cb0' stroke-width='3'/><circle cx='0' cy='-58' r='4' fill='#2b6cb0'/></g><text x='160' y='306' text-anchor='start' font-size='22' fill='#1a202c' font-weight='normal' font-style='normal'>Quizer i Canvas</text><g transform='translate(120,366) scale(0.55)'><rect x='-18' y='-46' width='36' height='32' rx='6' fill='#2b6cb0'/><circle cx='-7' cy='-32' r='4' fill='#fff'/><circle cx='7' cy='-32' r='4' fill='#fff'/><rect x='-24' y='-8' width='48' height='38' rx='8' fill='#2b6cb0'/><line x1='0' y1='-46' x2='0' y2='-56' stroke='#2b6cb0' stroke-width='3'/><circle cx='0' cy='-58' r='4' fill='#2b6cb0'/></g><text x='160' y='374' text-anchor='start' font-size='22' fill='#1a202c' font-weight='normal' font-style='normal'>Oppgaver med fasit</text><g transform='translate(120,434) scale(0.55)'><rect x='-18' y='-46' width='36' height='32' rx='6' fill='#2b6cb0'/><circle cx='-7' cy='-32' r='4' fill='#fff'/><circle cx='7' cy='-32' r='4' fill='#fff'/><rect x='-24' y='-8' width='48' height='38' rx='8' fill='#2b6cb0'/><line x1='0' y1='-46' x2='0' y2='-56' stroke='#2b6cb0' stroke-width='3'/><circle cx='0' cy='-58' r='4' fill='#2b6cb0'/></g><text x='160' y='442' text-anchor='start' font-size='22' fill='#1a202c' font-weight='normal' font-style='normal'>Forelesningsnotater</text><g transform='translate(120,502) scale(0.55)'><rect x='-18' y='-46' width='36' height='32' rx='6' fill='#2b6cb0'/><circle cx='-7' cy='-32' r='4' fill='#fff'/><circle cx='7' cy='-32' r='4' fill='#fff'/><rect x='-24' y='-8' width='48' height='38' rx='8' fill='#2b6cb0'/><line x1='0' y1='-46' x2='0' y2='-56' stroke='#2b6cb0' stroke-width='3'/><circle cx='0' cy='-58' r='4' fill='#2b6cb0'/></g><text x='160' y='510' text-anchor='start' font-size='22' fill='#1a202c' font-weight='normal' font-style='normal'>Oppsummeringer</text><text x='310' y='545' text-anchor='middle' font-size='18' fill='#718096' font-weight='normal' font-style='italic'>laget med agenter, rettet av meg</text><rect x='640' y='110' width='500' height='470' rx='18' fill='#f0fff4' stroke='#2f855a' stroke-width='2'/><text x='890' y='155' text-anchor='middle' font-size='26' fill='#2f855a' font-weight='bold' font-style='normal'>I timen</text><g transform='translate(700,230) scale(0.55)'><circle cx='0' cy='-30' r='16' fill='#2f855a'/><path d='M-24,30 C-24,-5 24,-5 24,30 z' fill='#2f855a'/></g><text x='740' y='238' text-anchor='start' font-size='22' fill='#1a202c' font-weight='normal' font-style='normal'>Lytte sammen</text><g transform='translate(700,298) scale(0.55)'><circle cx='0' cy='-30' r='16' fill='#2f855a'/><path d='M-24,30 C-24,-5 24,-5 24,30 z' fill='#2f855a'/></g><text x='740' y='306' text-anchor='start' font-size='22' fill='#1a202c' font-weight='normal' font-style='normal'>Måle og prøve</text><g transform=